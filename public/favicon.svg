<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Premium Dark Gradient Background -->
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Square Base -->
  <rect width="100" height="100" rx="22" fill="url(#dark-bg)" />
  
  <!-- Orange Border to match your theme -->
  <rect width="96" height="96" x="2" y="2" rx="20" fill="none" stroke="#f68b1e" stroke-width="4" />
  
  <!-- Bold "ZIG" Initials -->
  <text 
    x="50%" 
    y="56%" 
    font-family="system-ui, -apple-system, Arial, sans-serif" 
    font-weight="900" 
    font-size="40" 
    fill="#f68b1e" 
    text-anchor="middle" 
    dominant-baseline="middle" 
    letter-spacing="1">
    ZIG
  </text>
</svg>
